# team-config.yml — Project-specific configuration for the Lindalë framework.
#
# This file is scaffolded once by install.sh and never overwritten.
# Customize it for your project.

# Project metadata
# project:
#   name: my-project
#   description: A brief description of your project

# Domain SME configuration
# sme:
#   role_name: domain-sme
#   domain_hint: your domain area

# Toolchain — project-specific build/test commands
# toolchain:
#   test: npm test
#   build: npm run build
#   lint: npm run lint

# Autodev state-label mapping — downstream projects commonly remap the
# lifecycle labels used by .claude/commands/autodev.md's state machine
# (e.g. `needs-arch-review`, `arch-approved`, `ready-for-review`) to their
# own label sets. Not yet configurable here — follow-up owned by DX-005
# (#5, Project Configuration System), the ticket for this file's config
# surface. Deliberately not pointed at #89 (DX-038): that ticket closes with
# PR #101, which is what made the previous pointer dangle.
# labels:
#   needs-arch-review: needs-arch-review
#   arch-approved: arch-approved
#   ready-for-review: ready-for-review

# Persona routing (DX-039) — override which agent plans a ticket or joins
# review, without forking autodev.md or tpm.md. Agent names must exist in
# .claude/agents/ (or be dispatchable via the Agent tool). If this whole
# `routing:` block is absent, autodev falls back to today's default: every
# ticket is planned by `architect`, and review is the architect's review
# plus discretionary domain reviewers (SME, security, i18n, etc.) that the
# TPM dispatches as appropriate for what the PR touches.
#
# routing:
#   planners:
#     # issue-prefix -> planning agent, checked at the NEEDS_REVIEW step.
#     # Prefixes not listed here fall back to `architect`.
#     FEAT: architect
#     EPIC: architect
#     DX: architect
#     INFRA: architect
#     BUG: architect
#     DOCS: architect
#     # Example split (juno-style): route FEAT/EPIC to a product-facing
#     # planner and BUG to whichever agent owns the affected area:
#     # FEAT: flight-director
#     # EPIC: flight-director
#     # BUG: software-architect
#   reviewers:
#     # path-glob -> additional reviewer agent dispatched alongside the
#     # planner-of-record during the REVIEW state, when the PR touches
#     # matching paths. Globs are matched against `gh pr diff --name-only`
#     # for the PR.
#     # No default entries — an empty/absent table doesn't turn off review
#     # fan-out, it just leaves it discretionary: the TPM still dispatches
#     # domain reviewers (SME, security, i18n, etc.) as appropriate, same as
#     # before this config existed. Configuring entries here adds
#     # deterministic glob-based dispatch on top of that discretion; it does
#     # not replace it, and the TPM's discretion still applies when entries
#     # are present.
#     # "docs/**": domain-sme
#     # "*.sql": db-reviewer
#     # "src/i18n/**": i18n-reviewer
