name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Run every suite under scripts/tests/ via the same glob CLAUDE.md
      # documents as the project's test command — enumerating suites here
      # instead meant a newly added suite would be silently skipped by CI
      # while CLAUDE.md claimed it was gated. All suites run even if an
      # earlier one fails; the step fails if any suite failed.
      - name: All test suites (scripts/tests/test-*.sh)
        run: |
          fail=0
          for t in scripts/tests/test-*.sh; do
            echo "=== $t ==="
            bash "$t" || fail=1
          done
          exit "$fail"
