name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install / adoption tests
        run: bash scripts/tests/test-adoption.sh

      - name: trampollm tests (FEAT-018)
        run: bash scripts/tests/test-trampollm.sh
