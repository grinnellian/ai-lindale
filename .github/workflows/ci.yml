name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install / adoption tests
        run: bash scripts/tests/test-adoption.sh

      - name: Branch naming tests
        run: bash scripts/tests/test-branch-naming.sh

      - name: File overlap tests
        run: bash scripts/tests/test-file-overlap.sh

      - name: Audit-repo fixture tests
        run: bash scripts/tests/test-audit-repo-fixtures.sh

      - name: Researcher fixture tests
        run: bash scripts/tests/test-researcher-fixtures.sh

      - name: Skills assignment tests
        run: bash scripts/tests/test-skills-assignment.sh
