# Build and publish the pod-base image to GHCR (INFRA-011).
#
# Versioning: every main-branch build pushes :sha-<short> and :edge;
# tags matching pod-base-v* additionally push the semver tag and :latest.
name: pod-base image

on:
  push:
    branches: [main]
    paths:
      - "infra/pod-base/**"
      - ".github/workflows/pod-base-image.yml"
    tags:
      - "pod-base-v*"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ai-lindale-pod-base

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=edge,enable={{is_default_branch}}
            type=match,pattern=pod-base-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/pod-base-v') }}

      - name: Build (single-arch) and smoke test
        uses: docker/build-push-action@v6
        with:
          context: infra/pod-base
          load: true
          tags: ${{ env.IMAGE }}:smoke

      - name: Smoke test
        run: bash infra/pod-base/smoke-test.sh ${{ env.IMAGE }}:smoke

      - name: Build multi-arch and push
        uses: docker/build-push-action@v6
        with:
          context: infra/pod-base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
